version: '3'

vars:
  CORE: vendor/mgba_libretro.dylib
  GPSP_HOST: vendor/gpsp_libretro.dylib
  GAMBATTE_HOST: vendor/gambatte_libretro.dylib
  MGBA_COMMIT: e31759b24e7a4e3899285ff720d7b573ac328ae7
  GPSP_COMMIT: 7b2dd37394e2822110cacef321e9bb291a305b77
  GAMBATTE_COMMIT: 77f2567d718b8973d02caa2daa8dce4953faf811
  DSPERATE_COMMIT: 99618eb956c66083618395dbae9bb5cbf0241d16
  EXFATPROGS_VERSION: 1.4.3
  EXFATPROGS_SHA256: 4b5052cba6ff9f6dcb1c63eeeac328620472c5b0b3caf3d38e4ada50e75469d3
  SLOT_IN_PROCESS: >-
    --test bios --test core --test core_options --test e2e --test emu --test gb_palette_recolour --test gpsp --test gambatte_save
    --test link_ui --test mgba_gb_link --test mgba_link --test render_colour_correction
    --test render_gb_palette --test render_picture_modes --test render
    --test render_in_game_menu --test render_power_wake --test render_quick_menu
    --test render_shelf --test render_shelves --test render_screenshot --test render_gallery_stress --test render_clock
  IN_PROCESS: >-
    (package(slot) & (binary(bios) | binary(core) | binary(core_options) | binary(e2e) | binary(emu)
    | binary(gb_palette_recolour) | binary(gpsp) | binary(gambatte_save) | binary(link_ui) | binary(mgba_gb_link)
    | binary(mgba_link) | binary(render_colour_correction) | binary(render_gb_palette)
    | binary(render_picture_modes) | binary(render) | binary(render_in_game_menu)
    | binary(render_power_wake) | binary(render_quick_menu) | binary(render_shelf)
    | binary(render_shelves) | binary(render_screenshot) | binary(render_gallery_stress) | binary(render_clock)))
    | (package(slot-gfx) & binary(pipeline)) | (package(slot-ui) & binary(render_row_edges))
    | (package(slot-retro) & (binary(options) | binary(netpacket) | binary(libretro)))

tasks:
  default:
    desc: List available tasks
    silent: true
    cmds:
      - task --list

  build:
    desc: Debug build of the whole workspace
    cmds:
      - cargo build --workspace

  release:
    desc: Release build of the slot binary
    cmds:
      - cargo build --release -p slot

  test:
    desc: Run the whole test suite in parallel with cargo-nextest, silent
    env:
      SLOT_SILENT: '1'
    cmds:
      - cargo nextest run --workspace --features slot/romm --no-fail-fast -E 'not ({{.IN_PROCESS}})'
      - cargo test -p slot --no-fail-fast {{.SLOT_IN_PROCESS}}
      - cargo test -p slot-gfx --test pipeline
      - cargo test -p slot-ui --test render_row_edges
      - cargo test -p slot-retro --test options --test netpacket --test libretro

  test:one:
    desc: Run tests matching FILTER, eg task test:one FILTER=gesture
    requires:
      vars: [ FILTER ]
    env:
      SLOT_SILENT: '1'
    cmds:
      - cargo nextest run --workspace {{.FILTER}}

  test:collections:
    desc: Run the collections test checklist and print it ticked
    cmds:
      - python3 tools/collections_checklist.py

  fmt:
    desc: Format the workspace
    cmds:
      - cargo fmt --all

  fmt:check:
    desc: Fail if anything is unformatted
    cmds:
      - cargo fmt --all -- --check

  lint:
    desc: Clippy over all targets with warnings denied
    cmds:
      - cargo clippy --workspace --all-targets -- -D warnings

  lint:device:
    desc: Clippy the device build, which the host lint never compiles
    cmds:
      - cargo clippy -p slot --no-default-features --features device -- -D warnings

  check:
    desc: Everything a CI run would do
    cmds:
      - task: fmt:check
      - task: lint
      - task: lint:device
      - task: test
      - task: test:card

  test:card:
    desc: Test the scripts slot ships on the card, off-device
    cmds:
      - sh card/test-slotlink.sh
      - sh card/test-led.sh
      - sh card/test-lid.sh
      - sh card/test-coresave.sh
      - sh card/test-launch.sh
      - sh card/test-repair.sh

  core:
    desc: >-
      Build mGBA and fetch gpSP and Gambatte for this host. A missing core silently runs the mock (a test
      pattern and a sine tone) instead
    cmds:
      - task: core:mgba:host
      - task: core:gpsp:host
      - task: core:gambatte:host

  core:mgba:host:
    desc: Build mgba_libretro for this host from the pinned libretro/mgba commit and cores/mgba's patches
    status:
      - test -f {{.CORE}}
      - test "$(cat {{.CORE}}.meta 2>/dev/null)" = "$(sh cores/mgba/build.sh stamp {{.MGBA_COMMIT}})"
    cmds:
      - sh cores/mgba/build.sh build {{.MGBA_COMMIT}} target/mgba {{.CORE}}
      - file {{.CORE}} | grep -q Mach-O
      - 'echo "built {{.CORE}}"'

  core:gpsp:host:
    desc: Fetch the host gpSP core from the libretro buildbot
    status:
      - test -f {{.GPSP_HOST}}
    cmds:
      - |
        set -euo pipefail
        case "$(uname -m)" in
          arm64)  arch=arm64 ;;
          x86_64) arch=x86_64 ;;
          *) echo "unsupported arch $(uname -m)" >&2; exit 1 ;;
        esac
        mkdir -p vendor
        curl -fsSL -o vendor/gpsp-host.zip \
          "https://buildbot.libretro.com/nightly/apple/osx/${arch}/latest/gpsp_libretro.dylib.zip"
        unzip -o -q vendor/gpsp-host.zip -d vendor
        rm -f vendor/gpsp-host.zip
        file {{.GPSP_HOST}} | grep -q Mach-O
        echo "fetched {{.GPSP_HOST}}"

  core:gambatte:host:
    desc: Fetch the host Gambatte core from the libretro buildbot
    status:
      - test -f {{.GAMBATTE_HOST}}
    cmds:
      - |
        set -euo pipefail
        case "$(uname -m)" in
          arm64)  arch=arm64 ;;
          x86_64) arch=x86_64 ;;
          *) echo "unsupported arch $(uname -m)" >&2; exit 1 ;;
        esac
        mkdir -p vendor
        curl -fsSL -o vendor/gambatte-host.zip \
          "https://buildbot.libretro.com/nightly/apple/osx/${arch}/latest/gambatte_libretro.dylib.zip"
        unzip -o -q vendor/gambatte-host.zip -d vendor
        rm -f vendor/gambatte-host.zip
        file {{.GAMBATTE_HOST}} | grep -q Mach-O
        echo "fetched {{.GAMBATTE_HOST}}"

  core:update:
    desc: Rebuild mGBA and re-fetch gpSP and Gambatte for this host even if they are already vendored
    cmds:
      - rm -f {{.CORE}} {{.CORE}}.meta {{.GPSP_HOST}} {{.GAMBATTE_HOST}}
      - task: core

  icons:
    desc: Re-fetch the nerd font symbols used by the HUD
    vars:
      ASSETS: crates/slot-ui/assets
      TTF: SymbolsNerdFontMono-Regular.ttf
    cmds:
      - |
        set -euo pipefail
        tmp="$(mktemp -d)"
        trap 'rm -rf "$tmp"' EXIT
        curl -fsSL -o "$tmp/symbols.zip" \
          "https://github.com/ryanoasis/nerd-fonts/releases/latest/download/NerdFontsSymbolsOnly.zip"
        unzip -o -q "$tmp/symbols.zip" '{{.TTF}}' LICENSE -d "$tmp"
        mv "$tmp/{{.TTF}}" "{{.ASSETS}}/{{.TTF}}"
        mv "$tmp/LICENSE" "{{.ASSETS}}/{{.TTF}}.LICENSE.txt"
        echo "fetched {{.ASSETS}}/{{.TTF}}"

  sdcard:
    desc: Create an empty content root, ROOT defaults to ./sdcard
    deps: [ build ]
    vars:
      ROOT: '{{.ROOT | default "./sdcard"}}'
    cmds:
      - ./target/debug/slot --init-root {{.ROOT}}
      - 'echo "content root ready at {{.ROOT}}: roms in Games/GBA, Games/GB or Games/GBC, labels in the matching Labels/GBA, Labels/GB or Labels/GBC, battery saves in the matching Saves/GBA, Saves/GB or Saves/GBC, save states under the matching States/GBA, States/GB or States/GBC, gba_bios.bin in BIOS, pngs in Wallpapers"'

  run:
    desc: >-
      Run slot. against SLOT_ROOT, defaults to ./sdcard. SLOT_LINK_PORT moves the link
      session off 7211, which is what lets two copies on one machine link to each other -
      off-device both are on loopback, so the port is all that separates them
    deps: [ core, web ]
    env:
      SLOT_ROOT: '{{.SLOT_ROOT | default "./sdcard"}}'
      SLOT_SILENT: '0'
      SLOT_WIFI: '1'
    cmds:
      - mkdir -p "$SLOT_ROOT/System/web"
      - cp -R web/dist/. "$SLOT_ROOT/System/web/"
      - cargo run --release -p slot

  run:bare:
    desc: Run with no title bar or border, for screenshots and screen capture
    deps: [ core, web ]
    env:
      SLOT_ROOT: '{{.SLOT_ROOT | default "./sdcard"}}'
      SLOT_SILENT: '0'
      SLOT_WIFI: '1'
      SLOT_BARE: '1'
    cmds:
      - mkdir -p "$SLOT_ROOT/System/web"
      - cp -R web/dist/. "$SLOT_ROOT/System/web/"
      - cargo run --release -p slot

  run:4x3:
    desc: Run in a 4:3 window, as on the RG35XXSP, with the bezel around the screen
    deps: [ core, web ]
    env:
      SLOT_ROOT: '{{.SLOT_ROOT | default "./sdcard"}}'
      SLOT_SILENT: '0'
      SLOT_WIFI: '1'
      SLOT_WINDOW: '1280x960'
    cmds:
      - mkdir -p "$SLOT_ROOT/System/web"
      - cp -R web/dist/. "$SLOT_ROOT/System/web/"
      - cargo run --release -p slot

  run:ds:
    desc: >-
      Run slot as the RG DS+ on the Mac: the nds build in two 1024x768 windows, the top
      screen and the bottom screen below it. Click in the bottom window to touch the DS
      bottom screen. DS games run on DSperate built for the Mac, without its JIT.
    deps: [ core, core:dsperate:host, web ]
    env:
      SLOT_ROOT: '{{.SLOT_ROOT | default "./sdcard"}}'
      SLOT_SILENT: '0'
      SLOT_WIFI: '1'
      SLOT_DUAL: '1'
    cmds:
      - mkdir -p "$SLOT_ROOT/System/web"
      - cp -R web/dist/. "$SLOT_ROOT/System/web/"
      - cargo run --release -p slot --features nds

  run:debug:
    desc: Run an unoptimised build, for a debugger. Will not hold 60 fps.
    deps: [ core, web ]
    env:
      SLOT_ROOT: '{{.SLOT_ROOT | default "./sdcard"}}'
      SLOT_SILENT: '0'
      SLOT_WIFI: '1'
    cmds:
      - mkdir -p "$SLOT_ROOT/System/web"
      - cp -R web/dist/. "$SLOT_ROOT/System/web/"
      - cargo run -p slot

  web:
    desc: Build the Server web page into web/dist
    dir: web
    sources:
      - src/**/*
      - public/**/*
      - index.html
      - package.json
      - vite.config.ts
    generates:
      - dist/index.html
    cmds:
      - bun install --frozen-lockfile
      - bun run build

  site:
    desc: Serve the docs site locally with live reload, ADDR defaults to localhost:8000
    vars:
      ADDR: '{{.ADDR | default "localhost:8000"}}'
    cmds:
      - uv tool run --python 3.13 --from zensical==0.0.71 zensical serve -f site/zensical.toml -a {{.ADDR}}

  dist:
    desc: Build the copy-to-SD2 tree, OUT defaults to ./dist
    deps: [ core, release, web ]
    vars:
      OUT: '{{.OUT | default "dist"}}'
    cmds:
      - rm -rf {{.OUT}}
      - ./target/release/slot --init-root {{.OUT}}
      - cp target/release/slot {{.OUT}}/System/slot
      - cp {{.CORE}} {{.GPSP_HOST}} {{.GAMBATTE_HOST}} {{.OUT}}/System/
      - cp -R web/dist {{.OUT}}/System/web
      - 'echo "dist ready at {{.OUT}}, copy its contents to SD2"'

  core:device:
    desc: Build the aarch64 linux mgba core for the device bundle, in the box the device build uses
    status:
      - test -f vendor/mgba_libretro.so
      - test "$(cat vendor/mgba_libretro.so.meta 2>/dev/null)" = "$(sh cores/mgba/build.sh stamp {{.MGBA_COMMIT}})"
    cmds:
      - task: device:sh
        vars:
          CMD: sh cores/mgba/build.sh build {{.MGBA_COMMIT}} target-device/mgba vendor/mgba_libretro.so
      - file vendor/mgba_libretro.so | grep -q aarch64
      - 'echo "built vendor/mgba_libretro.so"'

  core:gpsp:
    desc: >-
      Build the aarch64 linux gpSP core from its pinned source archive, which ships beside it
      as its GPL-2.0 section 3(a) corresponding source
    status:
      - test -f vendor/gpsp_libretro.so
      - test -f vendor/gpsp-src.tar.gz
      - test "$(cat vendor/gpsp-src.sha 2>/dev/null)" = "{{.GPSP_COMMIT}}"
      - test "$(cat vendor/gpsp_libretro.so.meta 2>/dev/null)" = "$(sh cores/gpsp/build.sh stamp {{.GPSP_COMMIT}})"
      - test "$(cat vendor/gpsp-src.meta 2>/dev/null)" = "$(sh cores/gpsp/build.sh stamp {{.GPSP_COMMIT}})"
    cmds:
      - |
        set -euo pipefail
        mkdir -p vendor
        rm -f vendor/gpsp_libretro.so vendor/gpsp_libretro.so.meta \
              vendor/gpsp-src.tar.gz vendor/gpsp-src.sha vendor/gpsp-src.meta
        curl -fsSL -o vendor/gpsp-src.tar.gz \
          "https://github.com/libretro/gpsp/archive/{{.GPSP_COMMIT}}.tar.gz"
        tar -tzf vendor/gpsp-src.tar.gz | grep "^gpsp-{{.GPSP_COMMIT}}/Makefile$" > /dev/null
      - task: device:sh
        vars:
          CMD: >-
            sh cores/gpsp/build.sh build {{.GPSP_COMMIT}} vendor/gpsp-src.tar.gz
            target-device/gpsp vendor/gpsp_libretro.so
      - file vendor/gpsp_libretro.so | grep -q aarch64
      - echo "{{.GPSP_COMMIT}}" > vendor/gpsp-src.sha
      - cp vendor/gpsp_libretro.so.meta vendor/gpsp-src.meta
      - 'echo "built vendor/gpsp_libretro.so from vendor/gpsp-src.tar.gz @ {{.GPSP_COMMIT}}"'

  core:gpsp:update:
    desc: Refetch gpSP's source archive and rebuild the core from it, even if the set is current
    cmds:
      - >-
        rm -f vendor/gpsp_libretro.so vendor/gpsp_libretro.so.meta vendor/gpsp-src.tar.gz
        vendor/gpsp-src.sha vendor/gpsp-src.meta
      - task: core:gpsp

  core:dsperate:host:
    desc: >-
      Build DSperate for the Mac as vendor/slot_ds.dylib, from the same pinned source with
      the macOS patches and without the JIT, so task run:ds plays DS games
    platforms: [darwin]
    status:
      - test -f vendor/slot_ds.dylib
      - test "$(cat vendor/slot_ds.dylib.meta 2>/dev/null)" = "$(sh cores/dsperate/build.sh host-stamp {{.DSPERATE_COMMIT}})"
    cmds:
      - |
        set -euo pipefail
        mkdir -p vendor
        if [ "$(cat vendor/dsperate-src.sha 2>/dev/null)" != "{{.DSPERATE_COMMIT}}" ] || [ ! -f vendor/dsperate-src.tar.gz ]; then
          curl -fsSL -o vendor/dsperate-src.tar.gz \
            "https://github.com/beebono/DSperate/archive/{{.DSPERATE_COMMIT}}.tar.gz"
        fi
        tar -tzf vendor/dsperate-src.tar.gz | grep -q "^DSperate-{{.DSPERATE_COMMIT}}/src/core/nds.h$"
        sh cores/dsperate/build.sh build-host {{.DSPERATE_COMMIT}} vendor/dsperate-src.tar.gz target-host/dsperate vendor
      - file vendor/slot_ds.dylib | grep -q "Mach-O"
      - 'echo "built vendor/slot_ds.dylib for the Mac @ {{.DSPERATE_COMMIT}}"'

  core:dsperate:
    desc: >-
      Build the aarch64 DSperate core as slot_ds.so for the RG DS+, from its pinned source
      archive, which ships beside it as its GPL-3.0 corresponding source
    status:
      - test -f vendor/slot_ds.so
      - test -f vendor/dsperate-src.tar.gz
      - test "$(cat vendor/dsperate-src.sha 2>/dev/null)" = "{{.DSPERATE_COMMIT}}"
      - test "$(sed '$d' vendor/slot_ds.so.meta 2>/dev/null)" = "$(sh cores/dsperate/build.sh stamp {{.DSPERATE_COMMIT}})"
    cmds:
      - |
        set -euo pipefail
        mkdir -p vendor
        rm -f vendor/slot_ds.so vendor/slot_ds.so.meta vendor/dsperate-headless \
              vendor/dsperate-src.tar.gz vendor/dsperate-src.sha
        curl -fsSL -o vendor/dsperate-src.tar.gz \
          "https://github.com/beebono/DSperate/archive/{{.DSPERATE_COMMIT}}.tar.gz"
        tar -tzf vendor/dsperate-src.tar.gz | grep -q "^DSperate-{{.DSPERATE_COMMIT}}/src/core/nds.h$"
      - |
        set -eu
        build="sh cores/dsperate/build.sh build {{.DSPERATE_COMMIT}} vendor/dsperate-src.tar.gz target-device/dsperate vendor"
        if [ "$(uname -s)-$(uname -m)" = "Linux-aarch64" ]; then
          $build
        else
          docker run --rm --platform linux/arm64 -v "$PWD":/src -w /src debian:bookworm $build
        fi
      - file vendor/slot_ds.so | grep -q aarch64
      - echo "{{.DSPERATE_COMMIT}}" > vendor/dsperate-src.sha
      - 'echo "built vendor/slot_ds.so from vendor/dsperate-src.tar.gz @ {{.DSPERATE_COMMIT}}"'

  core:dsperate:update:
    desc: Refetch DSperate's source archive and rebuild slot_ds.so from it, even if the set is current
    cmds:
      - rm -f vendor/slot_ds.so vendor/slot_ds.so.meta vendor/dsperate-src.tar.gz vendor/dsperate-src.sha
      - task: core:dsperate

  core:gambatte:
    desc: >-
      Build the aarch64 linux Gambatte core from its pinned source archive, which ships beside it
      as its GPL-2.0 section 3(a) corresponding source
    status:
      - test -f vendor/gambatte_libretro.so
      - test -f vendor/gambatte-src.tar.gz
      - test "$(cat vendor/gambatte-src.sha 2>/dev/null)" = "{{.GAMBATTE_COMMIT}}"
      - test "$(cat vendor/gambatte_libretro.so.meta 2>/dev/null)" = "$(sh cores/gambatte/build.sh stamp {{.GAMBATTE_COMMIT}})"
      - test "$(cat vendor/gambatte-src.meta 2>/dev/null)" = "$(sh cores/gambatte/build.sh stamp {{.GAMBATTE_COMMIT}})"
    cmds:
      - |
        set -euo pipefail
        mkdir -p vendor
        rm -f vendor/gambatte_libretro.so vendor/gambatte_libretro.so.meta \
              vendor/gambatte-src.tar.gz vendor/gambatte-src.sha vendor/gambatte-src.meta
        curl -fsSL -o vendor/gambatte-src.tar.gz \
          "https://github.com/libretro/gambatte-libretro/archive/{{.GAMBATTE_COMMIT}}.tar.gz"
        tar -tzf vendor/gambatte-src.tar.gz | grep "^gambatte-libretro-{{.GAMBATTE_COMMIT}}/Makefile$" > /dev/null
      - task: device:sh
        vars:
          CMD: >-
            sh cores/gambatte/build.sh build {{.GAMBATTE_COMMIT}} vendor/gambatte-src.tar.gz
            target-device/gambatte vendor/gambatte_libretro.so
      - file vendor/gambatte_libretro.so | grep -q aarch64
      - echo "{{.GAMBATTE_COMMIT}}" > vendor/gambatte-src.sha
      - cp vendor/gambatte_libretro.so.meta vendor/gambatte-src.meta
      - 'echo "built vendor/gambatte_libretro.so from vendor/gambatte-src.tar.gz @ {{.GAMBATTE_COMMIT}}"'

  core:gambatte:update:
    desc: Refetch Gambatte's source archive and rebuild the core from it, even if the set is current
    cmds:
      - >-
        rm -f vendor/gambatte_libretro.so vendor/gambatte_libretro.so.meta vendor/gambatte-src.tar.gz
        vendor/gambatte-src.sha vendor/gambatte-src.meta
      - task: core:gambatte

  core:gpsp:test:
    desc: Prove gpSP's Advance Wars session-flip patch still fixes what it was written for
    deps: [ core:gpsp ]
    cmds:
      - sh cores/gpsp/test/run.sh vendor/gpsp-src.tar.gz

  fsck:exfat:
    desc: >-
      Build a static aarch64 fsck.exfat from the pinned exfatprogs release, whose archive ships
      beside it as its GPL-2.0 corresponding source
    status:
      - test -f vendor/fsck.exfat
      - test -f vendor/exfatprogs-{{.EXFATPROGS_VERSION}}.tar.gz
    cmds:
      - |
        set -euo pipefail
        mkdir -p vendor
        rm -f vendor/fsck.exfat vendor/exfatprogs-*.tar.gz
        curl -fsSL -o vendor/exfatprogs-{{.EXFATPROGS_VERSION}}.tar.gz \
          "https://github.com/exfatprogs/exfatprogs/releases/download/{{.EXFATPROGS_VERSION}}/exfatprogs-{{.EXFATPROGS_VERSION}}.tar.gz"
        echo "{{.EXFATPROGS_SHA256}}  vendor/exfatprogs-{{.EXFATPROGS_VERSION}}.tar.gz" | shasum -a 256 -c -
      - task: device:sh
        vars:
          CMD: >-
            set -e; rm -rf target-device/exfatprogs; mkdir -p target-device/exfatprogs;
            tar -xzf vendor/exfatprogs-{{.EXFATPROGS_VERSION}}.tar.gz -C target-device/exfatprogs;
            cd target-device/exfatprogs/exfatprogs-{{.EXFATPROGS_VERSION}};
            ./configure --quiet; make -s -j4 LDFLAGS=-all-static;
            strip fsck/fsck.exfat; cp fsck/fsck.exfat ../../../vendor/fsck.exfat
      - file vendor/fsck.exfat | grep -q 'aarch64.*statically linked'
      - 'echo "built vendor/fsck.exfat from exfatprogs {{.EXFATPROGS_VERSION}}"'

  device:sh:
    desc: Run CMD on the box the device build wants, fetching one if this is not it
    internal: true
    requires:
      vars: [ CMD ]
    cmds:
      - |
        set -eu
        if [ "$(uname -s)-$(uname -m)" = "Linux-aarch64" ]; then
          sh -c '{{.CMD}}'
        else
          docker run --rm --platform linux/arm64 -v "$PWD":/src -w /src rust:1-bullseye sh -c '{{.CMD}}'
        fi

  build:device:
    desc: Build for the H700, in an arm64 container unless this is already one
    cmds:
      - task: device:sh
        vars:
          CMD: >-
            cargo build --profile device --target-dir target-device
            -p slot --no-default-features --features device
      - file target-device/device/slot | grep -q aarch64
      - 'echo "built target-device/device/slot"'

  build:device:ds:
    desc: Build for the RG DS+, the device build plus the nds feature, copied to target-device/device-ds/slot
    cmds:
      - task: device:sh
        vars:
          CMD: >-
            cargo build --profile device --target-dir target-device
            -p slot --no-default-features --features device,nds
      - mkdir -p target-device/device-ds
      - cp target-device/device/slot target-device/device-ds/slot
      - file target-device/device-ds/slot | grep -q aarch64
      - 'echo "built target-device/device-ds/slot"'

  bench:device:
    desc: Build core_bench, slot-retro's headless core benchmark, for the H700. It never ships
    cmds:
      - task: device:sh
        vars:
          CMD: >-
            cargo build --profile device --target-dir target-device
            -p slot-retro --example core_bench
      - file target-device/device/examples/core_bench | grep -q aarch64
      - 'echo "built target-device/device/examples/core_bench, adb push it to /tmp/core_bench"'

  dist:device:
    desc: Build the SD2 tree for an H700 device, OUT defaults to ./dist-device
    deps: [ core:device, core:gpsp, core:gambatte, fsck:exfat, build:device, web ]
    vars:
      OUT: '{{.OUT | default "dist-device"}}'
    cmds:
      - rm -rf {{.OUT}}
      - task: device:sh
        vars:
          CMD: ./target-device/device/slot --init-root {{.OUT}}
      - cp target-device/device/slot {{.OUT}}/System/slot
      - cp -R card/System/* {{.OUT}}/System/
      - cp -R web/dist {{.OUT}}/System/web
      - for d in Bezels Labels Wallpapers; do cp card/$d/README.txt {{.OUT}}/$d/; done
      - file vendor/mgba_libretro.so | grep -q aarch64
      - file vendor/gpsp_libretro.so | grep -q aarch64
      - file vendor/gambatte_libretro.so | grep -q aarch64
      - cp vendor/mgba_libretro.so {{.OUT}}/System/
      - cp vendor/gpsp_libretro.so {{.OUT}}/System/
      - cp vendor/gambatte_libretro.so {{.OUT}}/System/
      - cp vendor/fsck.exfat {{.OUT}}/System/
      - cp -r licenses {{.OUT}}/System/licenses
      - cp vendor/exfatprogs-{{.EXFATPROGS_VERSION}}.tar.gz {{.OUT}}/System/licenses/
      - |
        set -euo pipefail
        sha="$(cat vendor/gpsp-src.sha)"
        cp vendor/gpsp-src.tar.gz "{{.OUT}}/System/licenses/gpsp-${sha}.tar.gz"
        cp vendor/gpsp-src.meta "{{.OUT}}/System/licenses/gpsp-${sha}.meta"
        for p in cores/gpsp/*.patch; do
          cp "$p" "{{.OUT}}/System/licenses/gpsp-$(basename "$p")"
        done
      - |
        set -euo pipefail
        sha="$(cat vendor/gambatte-src.sha)"
        cp vendor/gambatte-src.tar.gz "{{.OUT}}/System/licenses/gambatte-${sha}.tar.gz"
        cp vendor/gambatte-src.meta "{{.OUT}}/System/licenses/gambatte-${sha}.meta"
        for p in cores/gambatte/*.patch; do
          cp "$p" "{{.OUT}}/System/licenses/gambatte-$(basename "$p")"
        done
      - |
        set -euo pipefail
        commit="$(grep '^commit=' vendor/mgba_libretro.so.meta | cut -d= -f2)"
        cp vendor/mgba_libretro.so.meta "{{.OUT}}/System/licenses/mgba-${commit}.meta"
        for p in cores/mgba/*.patch; do
          cp "$p" "{{.OUT}}/System/licenses/mgba-$(basename "$p")"
        done
      - 'echo "device tree ready at {{.OUT}}, copy its contents to SD2"'

  dist:device:ds:
    desc: Build the SD2 tree for the RG DS+, OUT defaults to ./dist-device-ds
    deps: [ core:device, core:gpsp, core:gambatte, core:dsperate, fsck:exfat, build:device:ds, web ]
    vars:
      OUT: '{{.OUT | default "dist-device-ds"}}'
    cmds:
      - rm -rf {{.OUT}}
      - task: device:sh
        vars:
          CMD: ./target-device/device-ds/slot --init-root {{.OUT}}
      - cp target-device/device-ds/slot {{.OUT}}/System/slot
      - cp -R card/System/* {{.OUT}}/System/
      - cp -R web/dist {{.OUT}}/System/web
      - for d in Bezels Labels Wallpapers; do cp card/$d/README.txt {{.OUT}}/$d/; done
      - file vendor/mgba_libretro.so | grep -q aarch64
      - file vendor/gpsp_libretro.so | grep -q aarch64
      - file vendor/gambatte_libretro.so | grep -q aarch64
      - cp vendor/mgba_libretro.so {{.OUT}}/System/
      - cp vendor/gpsp_libretro.so {{.OUT}}/System/
      - cp vendor/gambatte_libretro.so {{.OUT}}/System/
      - file vendor/slot_ds.so | grep -q aarch64
      - cp vendor/slot_ds.so {{.OUT}}/System/
      - cp vendor/fsck.exfat {{.OUT}}/System/
      - cp -r licenses {{.OUT}}/System/licenses
      - cp vendor/exfatprogs-{{.EXFATPROGS_VERSION}}.tar.gz {{.OUT}}/System/licenses/
      - |
        set -euo pipefail
        sha="$(cat vendor/gpsp-src.sha)"
        cp vendor/gpsp-src.tar.gz "{{.OUT}}/System/licenses/gpsp-${sha}.tar.gz"
        cp vendor/gpsp-src.meta "{{.OUT}}/System/licenses/gpsp-${sha}.meta"
        for p in cores/gpsp/*.patch; do
          cp "$p" "{{.OUT}}/System/licenses/gpsp-$(basename "$p")"
        done
      - |
        set -euo pipefail
        sha="$(cat vendor/gambatte-src.sha)"
        cp vendor/gambatte-src.tar.gz "{{.OUT}}/System/licenses/gambatte-${sha}.tar.gz"
        cp vendor/gambatte-src.meta "{{.OUT}}/System/licenses/gambatte-${sha}.meta"
        for p in cores/gambatte/*.patch; do
          cp "$p" "{{.OUT}}/System/licenses/gambatte-$(basename "$p")"
        done
      - |
        set -euo pipefail
        commit="$(grep '^commit=' vendor/mgba_libretro.so.meta | cut -d= -f2)"
        cp vendor/mgba_libretro.so.meta "{{.OUT}}/System/licenses/mgba-${commit}.meta"
        for p in cores/mgba/*.patch; do
          cp "$p" "{{.OUT}}/System/licenses/mgba-$(basename "$p")"
        done
      - |
        set -euo pipefail
        sha="$(cat vendor/dsperate-src.sha)"
        cp vendor/dsperate-src.tar.gz "{{.OUT}}/System/licenses/dsperate-${sha}.tar.gz"
        cp vendor/slot_ds.so.meta "{{.OUT}}/System/licenses/dsperate-${sha}.meta"
        tar -cf - -C cores/dsperate shim patches | gzip -n > "{{.OUT}}/System/licenses/dsperate-shim.tar.gz"
      - 'echo "RG DS+ tree ready at {{.OUT}}, copy its contents to the card"'

  deploy:device:
    desc: Build and push onto a device over adb, then restart it. SD defaults to /mnt/sdcard
    deps: [ core:device, core:gpsp, core:gambatte, fsck:exfat, build:device ]
    cmds:
      - task: deploy:push
        vars: { SD: '{{.SD}}' }

  deploy:all:
    desc: Build and push onto every attached adb device, then restart each. SD defaults to /mnt/sdcard
    deps: [ core:device, core:gpsp, core:gambatte, fsck:exfat, build:device ]
    vars:
      SERIALS:
        sh: adb devices | awk 'NR > 1 && $2 == "device" {print $1}'
    preconditions:
      - sh: test -n "{{.SERIALS}}"
        msg: no adb devices attached
    cmds:
      - for: { var: SERIALS }
        task: deploy:push
        vars: { SD: '{{.SD}}', SERIAL: '{{.ITEM}}' }

  deploy:push:
    internal: true
    vars:
      SD: '{{.SD | default "/mnt/sdcard"}}'
      ADB: 'adb{{if .SERIAL}} -s {{.SERIAL}}{{end}}'
    cmds:
      - "{{.ADB}} wait-for-device"
      - file vendor/mgba_libretro.so | grep -q aarch64
      - file vendor/gpsp_libretro.so | grep -q aarch64
      - file vendor/gambatte_libretro.so | grep -q aarch64
      - "{{.ADB}} push target-device/device/slot '{{.SD}}/System/slot'"
      - for f in card/System/*; do {{.ADB}} push "$f" '{{.SD}}/System/'; done
      - "{{.ADB}} push vendor/mgba_libretro.so '{{.SD}}/System/mgba_libretro.so'"
      - "{{.ADB}} push vendor/gpsp_libretro.so '{{.SD}}/System/gpsp_libretro.so'"
      - "{{.ADB}} push vendor/gambatte_libretro.so '{{.SD}}/System/gambatte_libretro.so'"
      - "{{.ADB}} push vendor/fsck.exfat '{{.SD}}/System/fsck.exfat'"
      - "{{.ADB}} push licenses '{{.SD}}/System/'"
      - "{{.ADB}} push vendor/exfatprogs-{{.EXFATPROGS_VERSION}}.tar.gz '{{.SD}}/System/licenses/'"
      - |
        set -euo pipefail
        sha="$(cat vendor/gpsp-src.sha)"
        {{.ADB}} push vendor/gpsp-src.tar.gz "{{.SD}}/System/licenses/gpsp-${sha}.tar.gz"
        {{.ADB}} push vendor/gpsp-src.meta "{{.SD}}/System/licenses/gpsp-${sha}.meta"
        for p in cores/gpsp/*.patch; do
          {{.ADB}} push "$p" "{{.SD}}/System/licenses/gpsp-$(basename "$p")"
        done
      - |
        set -euo pipefail
        sha="$(cat vendor/gambatte-src.sha)"
        {{.ADB}} push vendor/gambatte-src.tar.gz "{{.SD}}/System/licenses/gambatte-${sha}.tar.gz"
        {{.ADB}} push vendor/gambatte-src.meta "{{.SD}}/System/licenses/gambatte-${sha}.meta"
        for p in cores/gambatte/*.patch; do
          {{.ADB}} push "$p" "{{.SD}}/System/licenses/gambatte-$(basename "$p")"
        done
      - |
        set -euo pipefail
        commit="$(grep '^commit=' vendor/mgba_libretro.so.meta | cut -d= -f2)"
        {{.ADB}} push vendor/mgba_libretro.so.meta "{{.SD}}/System/licenses/mgba-${commit}.meta"
        for p in cores/mgba/*.patch; do
          {{.ADB}} push "$p" "{{.SD}}/System/licenses/mgba-$(basename "$p")"
        done
      - "{{.ADB}} shell 'chmod +x {{.SD}}/System/slot && sync'"
      - "{{.ADB}} reboot"
      - "{{.ADB}} wait-for-device"
      - 'echo "deployed to {{.SD}}{{if .SERIAL}} on {{.SERIAL}}{{end}}, device rebooting"'

  log:device:
    desc: Read slot's log back off a connected device
    vars:
      SD: '{{.SD | default "/mnt/sdcard"}}'
    cmds:
      - adb shell 'cat {{.SD}}/Logs/slot.log'

  clean:
    desc: Remove build output and dist
    cmds:
      - cargo clean
      - rm -rf dist dist-device target-device
