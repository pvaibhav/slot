name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: card tree
    runs-on: ubuntu-24.04-arm
    container: rust:1-bullseye
    outputs:
      zip: ${{ steps.package.outputs.zip }}
    steps:
      - uses: actions/checkout@v7

      - name: Install zip, cmake, Task and Bun
        run: |
          set -eu
          sed -i '/bullseye-security/d' /etc/apt/sources.list
          apt-get -o Acquire::Check-Valid-Until=false update
          apt-get install -y --no-install-recommends zip unzip cmake
          # taskfile.dev/install.sh reads the latest tag from a page that now redirects, so
          # install a pinned Task build and check it against Task's published checksum.
          task_tgz=task_linux_arm64.tar.gz
          curl -fsSLO --http1.1 --retry 5 --retry-delay 10 --retry-all-errors \
            "https://github.com/go-task/task/releases/download/v3.54.0/$task_tgz"
          echo "d7189d439d4a6058e39e1b2acd7c8b27acd4856691b408f23b242e4294e1df5b  $task_tgz" \
            | sha256sum -c -
          tar -xzf "$task_tgz" -C /usr/local/bin task
          rm "$task_tgz"
          # Bun's installer downloads from github.com too, which drops connections at times.
          for try in 1 2 3 4 5; do
            if curl -fsSL --retry 5 --retry-all-errors https://bun.sh/install \
              | BUN_INSTALL=/usr/local bash -s "bun-v1.2.6"; then
              break
            fi
            [ "$try" = 5 ] && exit 1
            sleep 10
          done

      - name: Build the tree
        run: task dist:device OUT="slot-${GITHUB_REF_NAME}"

      - name: Check what is about to ship
        run: sh tools/check-card-tree.sh "slot-${GITHUB_REF_NAME}"

      - name: Package
        id: package
        run: |
          set -eu
          out="slot-${GITHUB_REF_NAME}"
          zip="$out-h700.zip"
          zip -qry "$zip" "$out"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.zip }}
          path: ${{ steps.package.outputs.zip }}
          if-no-files-found: error

  publish:
    name: release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.zip }}

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ needs.build.outputs.zip }}
        run: |
          set -eu
          test "$(head -n 1 RELEASE_NOTES.md)" = "# ${GITHUB_REF_NAME}"
          tail -n +3 RELEASE_NOTES.md > notes.md
          gh release create "$GITHUB_REF_NAME" "$ZIP" --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --notes-file notes.md

      # The fork's devices read versions.json from the latest release, not from the site.
      - name: Attach versions.json for the updater
        if: github.repository != 'slot-cfw/slot'
        env:
          GH_TOKEN: ${{ github.token }}
          SLOT_REPO: ${{ github.repository }}
          OUT: versions.json
        run: |
          set -eu
          bash .github/scripts/versions.sh
          test "$(jq -r .stable.tag versions.json)" = "$GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" versions.json --repo "$GITHUB_REPOSITORY"

      - name: Publish versions.json with the site
        if: github.repository == 'slot-cfw/slot'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
