name: pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'CHANGELOG.md'
      - '.github/workflows/pages.yml'
      - '.github/scripts/**'
  schedule:
    - cron: '0 6,18 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: site
    if: github.repository == 'BrandonKowalski/slot'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - run: pip install zensical==0.0.71

      - run: zensical build --clean --strict -f site/zensical.toml

      - name: Publish versions.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OUT=site/public/versions.json SLOT_REPO="$GITHUB_REPOSITORY" bash .github/scripts/versions.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/public

      - id: deploy
        uses: actions/deploy-pages@v4
