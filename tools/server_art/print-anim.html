<script id="fs" type="x-shader">
precision highp float;
uniform sampler2D tex;
uniform vec2 pv,D,A;uniform float rot,sc,R,lift,tear,cut,mode,bow;
const vec2 SZ=vec2(226.,425.);
const float CUTY=407.,TH=.42;
const float SQ=1.5;
varying vec2 P;
const float PI=3.14159265;
vec2 local(vec2 s){vec2 r=s-pv;float c=cos(-rot),n=sin(-rot);return vec2(c*r.x-n*r.y,n*r.x+c*r.y)/sc+SZ;}
float alphaAt(vec2 q){
  if(q.x<0.||q.y<0.||q.x>SZ.x||q.y>SZ.y)return 0.;
  if(q.x<tear){
    float saw=abs(fract(q.x/6.)-.5)*5.;
    if(q.y>cut-saw)return 0.;
  }
  return texture2D(tex,q/SZ).a;
}
vec4 front(vec2 q){return alphaAt(q)>0.?texture2D(tex,q/SZ):vec4(0.);}
bool inside(vec2 q){return alphaAt(q)>.5;}
vec4 sheet(vec2 Q){
  float d=dot(Q-A,D);vec2 B=Q-D*d;
  vec3 backc=vec3(.885,.895,.88);
  if(mode>.5){
    if(d<R){
      float s=d<0.?PI*R-d*SQ:R*(PI-asin(d/R));
      vec2 q=B+D*s;
      if(inside(q)){
        float nz=d<0.?1.:sqrt(max(0.,1.-d*d/(R*R)));
        float l=mix(.70,.97,nz);
        float ghost=1.-.07*(1.-dot(front(q).rgb,vec3(.333)));
        return vec4(backc*l*ghost,1.);
      }
    }
    return vec4(0.);
  }
  if(d>=0.&&d<R){
    float s=R*asin(d/R);vec2 q=B+D*s;
    if(inside(q)){
      float nz=sqrt(max(0.,1.-d*d/(R*R)));
      vec4 t=front(q);t.rgb*=mix(.74,1.,nz);return t;
    }
  }
  if(d<0.){
    vec4 t=front(Q);
    if(t.a>0.){
      t.rgb*=1.-.20*exp(d/(R*.9));
      return t;
    }
  }
  return vec4(0.);
}
float phi(float y){float u=(y-CUTY*.5)/(CUTY*.5);return asin(clamp(u*sin(TH),-1.,1.));}
vec2 unbow(vec2 Q){
  if(bow<=0.)return Q;
  float u=(Q.y-CUTY*.5)/(CUTY*.5)*(TH/sin(TH));
  float su=u*sin(TH);
  if(abs(su)>=1.)return vec2(-1.);
  float f=asin(su)/TH;
  float w=1.+.022*cos(asin(su));
  return vec2(113.+(Q.x-113.)/w,CUTY*.5+f*CUTY*.5);
}
void main(){
  vec2 Q=unbow(local(P));
  vec4 s=sheet(Q);
  if(bow>0.&&s.a>0.){float n=sin(phi(Q.y));s.rgb*=1.-(.13*max(n,0.)+.03*max(-n,0.))+.02*(1.-abs(n));s.rgb*=1.-.10*pow(abs(n)/sin(TH),5.);}
  float sh=0.;
  for(int i=0;i<8;i++){
    float a=float(i)*.785;
    vec2 o=vec2(cos(a),sin(a))*lift*.55+vec2(lift*.3,lift*.42);
    sh+=sheet(unbow(local(P-o))).a/8.;
  }
  float aa=s.a,al=aa+(1.-aa)*sh*.5;
  gl_FragColor=vec4(s.rgb*aa,al);
}
</script>

  gl.uniform1f(U.mode,m);gl.uniform1f(U.tear,tear);gl.uniform1f(U.cut,CUT);
  gl.uniform2f(U.pv,px,py);gl.uniform1f(U.rot,ROTN);gl.uniform1f(U.sc,sc);gl.uniform1f(U.lift,lift);gl.uniform1f(U.R,R);
  gl.uniform2f(U.D,DX,DY);gl.uniform2f(U.A,-DX*k,-DY*k);

function draw(px,py,sc,lift,k,tear){

var bgI=new Image(),st=new Image(),wood=new Image(),prn=new Image(),leg=new Image(),menu=new Image();
var MENU=800,FADE=260,RISE=640,LAMP=260,STAY=2400,OUTP=380,GAP2=60,DROP=480;
START=MENU+FADE+RISE+LAMP;
var HOLDEND=START+FEED+HOLD+RIP+EXIT+GAP+BACK+STAY;
var LOOP=HOLDEND+OUTP+GAP2+DROP+FADE+MENU;
function clear(){f2.clearRect(0,0,720,480);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT)}
function lampOff(y){b2.fillStyle='#14161b';b2.beginPath();b2.arc(355,349+y,9,0,6.3);b2.fill()}
function setup(dy,lamp){b2.drawImage(wood,0,0);b2.drawImage(prn,0,dy);if(!lamp)lampOff(dy)}
function eout(t){return 1-Math.pow(1-t,3)}
function ein(t){return t*t*t}
function frame(t){
  t=t%LOOP;
  BOW=0;ROTN=0;g.style.zIndex=2;
  if(t<START){
    over.style.visibility='hidden';clear();
    var a=t;
    if(a<MENU){b2.drawImage(menu,0,0);return}
    a-=MENU;
    if(a<FADE){setup(490,false);b2.globalAlpha=1-a/FADE;b2.drawImage(menu,0,0);b2.globalAlpha=1;return}
    a-=FADE;
    if(a<RISE){setup(490*(1-eout(a/RISE)),false);return}
    a-=RISE;
    setup(0,a>LAMP*.45);b2.globalAlpha=inout(a/LAMP);b2.drawImage(leg,0,0);b2.globalAlpha=1;return;
  }
  if(t>=HOLDEND){
    var a=t-HOLDEND;
    if(a<OUTP){over.style.visibility='hidden';clear();setup(0,true);b2.globalAlpha=1-a/OUTP;b2.drawImage(leg,0,0);b2.globalAlpha=1;
      g.style.zIndex=4;BOW=1;draw(RX+SW,lerp(RY+SH,960,ein(a/OUTP)),1,9,-60,400);return}
    a-=OUTP;over.style.visibility='hidden';clear();
    if(a<GAP2){setup(0,false);return}
    a-=GAP2;
    if(a<DROP){setup(490*ein(a/DROP),false);return}
    a-=DROP;
    if(a<FADE){setup(490,false);b2.globalAlpha=a/FADE;b2.drawImage(menu,0,0);b2.globalAlpha=1;return}
    b2.drawImage(menu,0,0);return;
  }
  over.style.visibility='visible';
  var a=t-START;
  b2.drawImage(bgI,0,0);b2.drawImage(leg,0,0);
  if(a<FEED){draw(PX,Y0+SH-SH*Math.floor(a/FEED*62)/62,1,4,-60,-1);return}
  a-=FEED;
  if(a<HOLD){draw(PX,Y0,1,4,-60,-1);return}
  a-=HOLD;
  if(a<RIP){var p=a/RIP,k=lerp(-40,500,p*p*(1.6-.6*p)),tear=Math.max(-1,(k-.78*CUT)/.62);draw(PX,Y0,1,lerp(4,10,p),k,tear);return}
  a-=RIP;
  g.style.zIndex=4;
  if(a<EXIT){var e=a/EXIT,m=e*(.55+.45*e);draw(PX+170*m,Y0+640*m,1+.06*e,10+6*e,500,400);return}
  a-=EXIT;
  if(a<GAP){clear();return}
  a-=GAP;
  BOW=1;
  if(a<BACK){var e=eout(a/BACK),rest=RY+SH;draw(RX+SW,lerp(960,rest,e),1,lerp(16,9,e),-60,400);return}
  draw(RX+SW,RY+SH,1,9,-60,400);
}
