[package]
name = "slot-labels"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
slot-store = { path = "../slot-store" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
unicode-normalization = "0.1"
tempfile.workspace = true
crc32fast = "1"

[dev-dependencies]
quick-xml = "0.41"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[[example]]
name = "launchbox-index"
path = "examples/launchbox-index.rs"

[[example]]
name = "artwork-pack"
path = "examples/artwork-pack.rs"

[[example]]
name = "cheats-pack"
path = "examples/cheats-pack.rs"
